<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>SecureIntent · Account</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <style>
      :root {
        color-scheme: dark;
        --base: #050507;
        --panel: #0a0e1a;
        --cyan: #72ffff;
        --navy: #052656;
        --text: #f4f6f8;
        --muted: #8b949e;
        --faint: #5a626b;
        --danger: #ff6b6b;
        --border: rgba(255, 255, 255, 0.08);
        --mono: "Fira Code", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 50% -10%, #0b1530, #050507 62%);
        color: var(--text);
        font-family: var(--sans);
        display: flex;
        flex-direction: column;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 1120px;
        margin: 0 auto;
        padding: 22px 28px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        text-decoration: none;
      }
      .brand svg {
        display: block;
      }
      .brand-word {
        font-family: var(--sans);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand .accent {
        color: var(--cyan);
      }
      .backlink {
        font-size: 13px;
        color: var(--muted);
        text-decoration: none;
      }
      .backlink:hover {
        color: var(--cyan);
      }

      /* Main is a centering stage. Short content (sign-in) centers on both axes;
         tall content (account/profile) sits toward the top. */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 20px 64px;
      }
      #loading {
        margin: auto 0;
        color: var(--muted);
        font-size: 14px;
      }

      /* Sign-in — vertically centered card */
      #auth {
        margin: auto 0;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .auth-head {
        text-align: center;
      }
      .auth-head h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 650;
      }
      .auth-head p {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
      }

      /* Account — top aligned, constrained width */
      #account {
        width: 100%;
        max-width: 940px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 20px;
        margin-top: 8px;
      }
      .plan {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .plan-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .plan-who {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .plan-label {
        font-size: 13px;
        color: var(--muted);
      }
      .plan-name {
        font-family: var(--mono);
        font-weight: 600;
        color: var(--muted);
      }
      .plan-name.pro {
        color: var(--cyan);
      }
      .plan-sub {
        font-size: 12px;
        color: var(--faint);
        font-family: var(--mono);
      }
      button.manage {
        padding: 9px 15px;
        font-size: 13px;
        font-weight: 600;
        color: var(--cyan);
        background: transparent;
        border: 1px solid rgba(114, 255, 255, 0.35);
        border-radius: 9px;
        cursor: pointer;
        transition: background 150ms ease;
      }
      button.manage:hover {
        background: rgba(114, 255, 255, 0.08);
      }
      .plan-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      button.upgrade {
        padding: 10px 18px;
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
        color: var(--navy);
        background: var(--cyan);
        border: none;
        border-radius: 9px;
        cursor: pointer;
        transition: filter 150ms ease;
      }
      button.upgrade:hover {
        filter: brightness(1.08);
      }
      button.signout {
        padding: 9px 15px;
        font-size: 13px;
        font-weight: 600;
        color: var(--danger);
        background: rgba(255, 107, 107, 0.08);
        border: 1px solid rgba(255, 107, 107, 0.25);
        border-radius: 9px;
        cursor: pointer;
        transition: background 150ms ease;
      }
      button.signout:hover {
        background: rgba(255, 107, 107, 0.14);
      }
      .pro-badge {
        padding: 6px 12px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        color: var(--cyan);
        background: rgba(114, 255, 255, 0.1);
        border: 1px solid rgba(114, 255, 255, 0.25);
        border-radius: 999px;
      }
      /* Feature matrix — mirrors the extension popup's "Your plan" checklist. */
      .features {
        padding: 18px 20px 8px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 14px;
      }
      .features-head {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 6px;
      }
      .feature-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .feat {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
      .feat:first-child {
        border-top: none;
      }
      .feat-ic {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        color: var(--faint);
      }
      .feat-label {
        font-size: 14px;
        color: var(--text);
      }
      .feat-state {
        margin-left: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        white-space: nowrap;
      }
      .feat--active .feat-ic,
      .feat--usage .feat-ic {
        color: var(--cyan);
      }
      .feat--active .feat-state {
        color: var(--cyan);
      }
      .feat--locked .feat-label {
        color: var(--muted);
      }
      .feat--locked .feat-state {
        color: var(--cyan);
      }
      .feat--upcoming {
        opacity: 0.55;
      }
      .feat--upcoming .feat-state {
        color: var(--faint);
      }

      /* Clerk mount points — center their internal cards */
      #clerk-auth,
      #clerk-profile {
        width: 100%;
        display: flex;
        justify-content: center;
      }
      .sync-note {
        margin: 4px 0 0;
        padding: 12px 14px;
        font-size: 12.5px;
        line-height: 1.5;
        color: var(--muted);
        background: rgba(114, 255, 255, 0.05);
        border: 1px solid rgba(114, 255, 255, 0.16);
        border-radius: 10px;
        text-align: center;
      }
      [hidden] {
        display: none !important;
      }
    </style>

    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_live_Y2xlcmsuc2VjdXJlaW50ZW50LmFpJA"
      src="https://clerk.secureintent.ai/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  </head>
  <body>
    <div class="topbar">
      <a class="brand" href="/">
        <svg aria-label="SecureIntent" role="img" viewBox="0 0 250 250" width="32" height="32">
          <path
            d="M 50,195 L 110,75"
            fill="none"
            stroke="currentColor"
            stroke-width="28"
            stroke-linecap="round"
          ></path>
          <path
            d="M 130,195 L 160,135"
            fill="none"
            stroke="#72FFFF"
            stroke-width="28"
            stroke-linecap="round"
          ></path>
          <circle cx="190" cy="75" r="14" fill="#72FFFF"></circle>
        </svg>
        <span class="brand-word">SecureIntent<span class="accent">.ai</span></span>
      </a>
      <a class="backlink" href="/">← Home</a>
    </div>

    <main>
      <div id="loading">Loading…</div>

      <!-- Signed-out -->
      <div id="auth" hidden>
        <div class="auth-head">
          <h1 id="auth-title">Sign in</h1>
          <p id="auth-sub">Unlock Pro features and manage your account.</p>
        </div>
        <div id="clerk-auth"></div>
      </div>

      <!-- Signed-in -->
      <section id="account" hidden>
        <div class="plan">
          <div class="plan-info">
            <span class="plan-who" id="plan-who">—</span>
            <span class="plan-label"
              >Plan · <span class="plan-name" id="plan-name">—</span></span
            >
            <span class="plan-sub" id="plan-sub" hidden></span>
          </div>
          <div class="plan-actions">
            <button class="upgrade" id="upgrade" hidden>Upgrade · $4/mo</button>
            <button class="manage" id="manage" hidden>Manage subscription</button>
            <span class="pro-badge" id="pro-badge" hidden>Pro active</span>
            <button class="signout" id="signout">Sign out</button>
          </div>
        </div>

        <div class="features">
          <div class="features-head">What's included</div>
          <ul class="feature-list" id="feature-list"></ul>
        </div>

        <div id="clerk-profile"></div>
        <p class="sync-note">
          Signing in here syncs automatically to the SecureIntent browser extension.
        </p>
      </section>
    </main>

    <script>
      const CFG = {
        // Paddle client-side token — Paddle → Developer Tools → Authentication →
        // Client-side tokens (starts with "live_"). REQUIRED for Upgrade.
        paddleToken: "live_7ce4fc6784b4e1614713a5b29ee",
        paddleEnv: "production",
        priceId: "pri_01kvtk87ebyb41gyzm8ydne0hp",
        apiBase: "https://api.secureintent.ai",
        jwtTemplate: "secureintent",
      };

      const PLAN_LABEL = {
        developer: "Free",
        developer_pro: "Developer Pro",
        business_pro: "Business Pro",
      };

      // Theme Clerk's components to match the dark / cyan brand.
      const CLERK_APPEARANCE = {
        variables: {
          colorPrimary: "#72ffff",
          colorPrimaryForeground: "#052656", // dark text on the cyan primary button
          colorBackground: "#0a0e1a",
          colorText: "#f4f6f8",
          colorTextSecondary: "#8b949e",
          colorInputBackground: "#0d1220",
          colorInputText: "#f4f6f8",
          colorNeutral: "#ffffff",
          borderRadius: "10px",
          fontFamily: '"Inter", system-ui, sans-serif',
        },
        elements: {
          card: { boxShadow: "none", border: "1px solid rgba(255,255,255,0.08)" },
          rootBox: { width: "100%" },
          // Cyan button needs dark, bold text for contrast (Clerk defaults to white).
          formButtonPrimary: { color: "#052656", fontWeight: "600" },
        },
      };

      const $ = (id) => document.getElementById(id);

      // Feature matrix (mirrors the extension popup). The Pro toolkit is live
      // (locked on Free, active on Pro); business features are still "Soon".
      const CHECK_SVG =
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M8.4 12.2l2.4 2.4 4.8-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const CLOCK_SVG =
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 8v4.2l2.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const LOCK_SVG =
        '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="1.6"/></svg>';

      const ICON = { upcoming: CLOCK_SVG, locked: LOCK_SVG };

      function featureRows(isFree) {
        const anon = isFree
          ? { key: "anonymise", label: "Anonymise & Paste", state: "usage", detail: "—" }
          : { key: "anonymise", label: "Anonymise & Paste", state: "active", detail: "Unlimited" };
        const toolkit = (key, label) =>
          isFree
            ? { key, label, state: "locked", detail: "Pro" }
            : { key, label, state: "active", detail: "Active" };
        return [
          { key: "detection", label: "Detection & warnings", state: "active", detail: "Active" },
          anon,
          toolkit("rehydrate", "Rehydrate vault"),
          toolkit("ghost", "Ghost log sanitiser"),
          toolkit("session_lock", "Session Lock"),
          { key: "team_policy", label: "Team Policy Sync", state: "upcoming", detail: "Soon" },
          { key: "team_alerts", label: "Security-Team Alerts", state: "upcoming", detail: "Soon" },
        ];
      }

      function renderFeatures(isFree) {
        $("feature-list").innerHTML = featureRows(isFree)
          .map(
            (r) =>
              `<li class="feat feat--${r.state}" data-key="${r.key}">` +
              `<span class="feat-ic">${ICON[r.state] ?? CHECK_SVG}</span>` +
              `<span class="feat-label">${r.label}</span>` +
              `<span class="feat-state">${r.detail}</span></li>`,
          )
          .join("");
      }

      function setAnonDetail(text) {
        const el = document.querySelector('#feature-list .feat[data-key="anonymise"] .feat-state');
        if (el) el.textContent = text;
      }

      async function loadPlan() {
        try {
          const token = await window.Clerk.session.getToken({ template: CFG.jwtTemplate });
          const res = await fetch(`${CFG.apiBase}/v1/entitlement`, {
            headers: { Authorization: `Bearer ${token}` },
            cache: "no-store",
          });
          const data = await res.json();
          const plan = data?.entitlement?.plan ?? "developer";
          const status = data?.entitlement?.status;
          const isFree = plan === "developer";
          $("plan-name").textContent = PLAN_LABEL[plan] ?? plan;
          $("plan-name").classList.toggle("pro", !isFree);
          $("upgrade").hidden = !isFree;
          $("pro-badge").hidden = isFree;
          $("manage").hidden = isFree;
          if (!isFree && status) {
            $("plan-sub").textContent = `Subscription: ${status}`;
            $("plan-sub").hidden = false;
          } else {
            $("plan-sub").hidden = true;
          }
          // Render the full feature matrix; free plans then fill in the live
          // Anonymise & Paste allowance from the usage endpoint.
          renderFeatures(isFree);
          if (isFree) loadUsage(token);
        } catch (e) {
          console.error("[account] loadPlan failed", e);
        }
      }

      async function loadUsage(token) {
        try {
          const res = await fetch(`${CFG.apiBase}/v1/usage`, {
            headers: { Authorization: `Bearer ${token}` },
            cache: "no-store",
          });
          if (!res.ok) return;
          const u = await res.json();
          setAnonDetail(u.unlimited ? "Unlimited" : `${u.remaining} / ${u.limit} left`);
        } catch (e) {
          console.error("[account] loadUsage failed", e);
        }
      }

      async function openPortal() {
        try {
          const token = await window.Clerk.session.getToken({ template: CFG.jwtTemplate });
          const res = await fetch(`${CFG.apiBase}/v1/billing/portal`, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}` },
          });
          if (!res.ok) {
            console.error("[account] portal failed", res.status);
            return;
          }
          const { url } = await res.json();
          if (url) window.open(url, "_blank", "noopener");
        } catch (e) {
          console.error("[account] openPortal failed", e);
        }
      }

      function openCheckout() {
        const user = window.Clerk.user;
        if (!user) return;
        const email = user.primaryEmailAddress?.emailAddress;
        window.Paddle.Checkout.open({
          items: [{ priceId: CFG.priceId, quantity: 1 }],
          customData: { clerk_user_id: user.id },
          customer: email ? { email } : undefined,
          settings: { displayMode: "overlay", theme: "dark", allowLogout: false },
        });
      }

      function resumePendingTxn() {
        const ptxn = new URLSearchParams(location.search).get("_ptxn");
        if (ptxn) window.Paddle.Checkout.open({ transactionId: ptxn });
      }

      // Which Clerk component is currently mounted ('in' | 'signin' | 'signup').
      // Clerk.addListener fires render() on every state change (incl. mid-flow,
      // e.g. the email-verification step). Re-mounting each time would tear down
      // the in-progress flow, so we mount a given state ONCE and skip if unchanged.
      let mounted = null;

      function render() {
        $("loading").hidden = true;
        const signedIn = !!window.Clerk.user;
        $("account").hidden = !signedIn;
        $("auth").hidden = signedIn;

        if (signedIn) {
          $("plan-who").textContent =
            window.Clerk.user.primaryEmailAddress?.emailAddress ??
            window.Clerk.user.fullName ??
            "Your account";
          if (mounted !== "in") {
            mounted = "in";
            window.Clerk.mountUserProfile($("clerk-profile"), { appearance: CLERK_APPEARANCE });
            resumePendingTxn();
          }
          loadPlan();
          return;
        }

        // Signed out: keep sign-in AND sign-up on this page (don't fall back to
        // Clerk's hosted Account Portal). Mode chosen from ?mode=signup; the two
        // components cross-link via signInUrl / signUpUrl.
        const signUpMode = new URLSearchParams(location.search).get("mode") === "signup";
        const want = signUpMode ? "signup" : "signin";
        if (mounted === want) return; // already showing it — don't disturb the flow
        mounted = want;
        $("clerk-auth").replaceChildren();
        const common = {
          appearance: CLERK_APPEARANCE,
          afterSignInUrl: "/account.html",
          afterSignUpUrl: "/account.html",
        };
        if (signUpMode) {
          $("auth-title").textContent = "Create account";
          $("auth-sub").textContent = "Start protecting your prompts in seconds.";
          window.Clerk.mountSignUp($("clerk-auth"), { ...common, signInUrl: "/account.html" });
        } else {
          $("auth-title").textContent = "Sign in";
          $("auth-sub").textContent = "Unlock Pro features and manage your account.";
          window.Clerk.mountSignIn($("clerk-auth"), {
            ...common,
            signUpUrl: "/account.html?mode=signup",
          });
        }
      }

      async function main() {
        try {
          await window.Clerk.load();

          if (CFG.paddleToken && !CFG.paddleToken.startsWith("REPLACE")) {
            window.Paddle.Environment.set(CFG.paddleEnv);
            window.Paddle.Initialize({
              token: CFG.paddleToken,
              eventCallback: (e) => {
                if (e?.name === "checkout.completed") setTimeout(loadPlan, 3000);
              },
            });
          } else {
            console.warn("[account] Paddle client token not set — upgrade disabled.");
          }

          $("upgrade").addEventListener("click", openCheckout);
          $("manage").addEventListener("click", openPortal);
          $("signout").addEventListener("click", () => window.Clerk.signOut());
          render();
          window.Clerk.addListener(render);
        } catch (e) {
          console.error("[account] init failed", e);
          $("loading").textContent = "Failed to load. Please refresh.";
        }
      }

      if (window.Clerk) {
        main();
      } else {
        window.addEventListener("load", () => {
          const wait = setInterval(() => {
            if (window.Clerk && window.Paddle) {
              clearInterval(wait);
              main();
            }
          }, 60);
        });
      }
    </script>
  </body>
</html>
