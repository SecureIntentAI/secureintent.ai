[build]
  command = "node scripts/prepare-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[build.processing]
  skip_processing = true

# Provider-backed staging is opt-in for this exact branch only. Missing public
# settings fail the build; PR previews remain visual-only and have no live keys.
[context.branch-deploy.environment]
  SI_DEPLOY_ENV = "staging"

[context.deploy-preview.environment]
  SI_DEPLOY_ENV = "visual-preview"
